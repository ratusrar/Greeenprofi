/* --- Admin click handler --- */
function adminClick(act, el){
  const id = el.getAttribute('data-id');
  switch(act){
    case 'a-tab': state.adminTab = id; state.delConfirm = null; state.resetArm = false; renderAdminBody(); if(id === 'admins') loadUsersList(); break;
    case 'a-new': openEditor(null); break;
    case 'a-edit': openEditor(id); break;
    case 'a-vis': { const p = prod(id); p.visible = !p.visible; persist('products'); renderAdminList('[data-act="a-vis"][data-id="' + id + '"]'); updateBadge(); break; }
    case 'a-pop': { const p = prod(id); p.popular = !p.popular; persist('products'); renderAdminList('[data-act="a-pop"][data-id="' + id + '"]'); break; }
    case 'a-del':
      if(state.delConfirm === id){
        D.products = D.products.filter(p => p.id !== id); D.cart = D.cart.filter(c => c.id !== id); D.favs = D.favs.filter(f => f !== id);
        persist('products'); persist('cart'); persist('favs'); state.delConfirm = null; updateBadge(); renderAdminList(); toast(t('deleted'));
      } else {
        state.delConfirm = id; renderAdminList('[data-act="a-del"][data-id="' + id + '"]');
        setTimeout(() => { if(state.delConfirm === id){ state.delConfirm = null; renderAdminList(); } }, 4000);
      }
      break;
    case 'a-photo-rm': edImg = null; edPreview(); break;
    case 'a-art-new': openArticleEditor(null); break;
    case 'a-art-edit': openArticleEditor(id); break;
    case 'a-art-photo-rm': edArtImg = null; artPreview(); break;
    case 'a-art-vis': {
      const a = (D.articles || []).find(x => x.id === id); if(!a) break;
      a.pub = !a.pub; a.updated = Date.now(); if(a.pub && !a.pubAt) a.pubAt = a.updated;
      persist('articles'); renderArtList('[data-act="a-art-vis"][data-id="' + id + '"]'); toast(t(a.pub ? 'artPublished' : 'artDraftSaved')); break;
    }
    case 'a-art-del':
      if(state.delConfirm === 'art:' + id){ deleteArticle(id); }
      else {
        state.delConfirm = 'art:' + id; renderArtList('[data-act="a-art-del"][data-id="' + id + '"]');
        setTimeout(() => { if(state.delConfirm === 'art:' + id){ state.delConfirm = null; renderArtList(); } }, 4000);
      }
      break;
    case 'a-art-deled':                                   /* delete from inside the editor: ask once more */
      if(el.getAttribute('data-armed')){ deleteArticle(id); }
      else {
        el.setAttribute('data-armed', '1'); el.innerHTML = t('artDelSure');
        setTimeout(() => { if(document.contains(el)){ el.removeAttribute('data-armed'); el.innerHTML = ic('trash', 'ic-sm') + t('artDelBtn'); } }, 4000);
      }
      break;
    case 'a-catdel': {
      const n = D.products.filter(p => p.cat === id).length;
      if(n){ toast(t('catUsed', {n: n}), {err: true}); break; }
      D.cats = D.cats.filter(c => c.id !== id); persist('cats'); renderAdminBody(); break;
    }
    case 'a-tr': { const P = TRP[el.getAttribute('data-for')]; if(P) P.run(true); break; }
    case 'a-admdel': {
      const em = el.getAttribute('data-email');
      if(!isOwner() || em === OWNER_EMAIL) break;
      Auth.removeAdmin(em).then(() => { loadUsersList(); renderAdminBody(); }, () => toast(t('srvDenied'), {err: true}));
      break;
    }
    case 'a-access': {                                    /* an administrator without an account: create it with a temporary password */
      const em = el.getAttribute('data-email'); if(!isOwner()) break;
      el.disabled = true;
      Auth.addAdmin(em).then(r => { loadUsersList(); if(r.temp) showTempPw(em, r.temp); }, () => { el.disabled = false; toast(t('srvFail'), {err: true}); });
      break;
    }
    case 'a-pwask': {                                     /* ask before replacing somebody's password */
      if(!isOwner()) break;
      const u = (state.usersList || []).find(x => x.id === id); if(!u) break;
      openModal('<div class="contact-sheet"><h2>' + t('admResetPw') + '</h2><p>' + t('resetAsk', {e: esc(u.email)}) + '</p>'
        + '<div class="form-actions"><button type="button" class="btn btn-outline" data-act="close">' + t('cancel') + '</button><button type="button" class="btn btn-danger" data-act="a-pwdo" data-id="' + esc(u.id) + '">' + t('resetYes') + '</button></div></div>', 'narrow', t('admResetPw'));
      break;
    }
    case 'a-pwdo': {
      if(!isOwner()) break;
      const u = (state.usersList || []).find(x => x.id === id); if(!u) break;
      el.disabled = true;
      Auth.resetPw(id).then(temp => { loadUsersList(); showTempPw(u.email, temp); }, () => { closeModal(); toast(t('srvFail'), {err: true}); });
      break;
    }
    case 'a-reset':
      if(state.resetArm){
        const keepPay = {}; ['payCash', 'payTransfer', 'payOnline', 'payAcc', 'payCard', 'payRecipient', 'payPurpose_ua', 'payPurpose_ru', 'payInstr_ua', 'payInstr_ru'].forEach(k => keepPay[k] = D.settings[k]);
        ['products', 'cats', 'settings', 'orders'].forEach(k => store.del(k));
        D.products = clone(PRODUCTS_SEED); D.cats = clone(CATS_SEED); D.settings = Object.assign({}, SETTINGS_SEED, keepPay); D.orders = []; D.cart = []; persist('cart'); persist('settings');
        state.resetArm = false; state.filters = {cat: 'all', sort: 'def', light: 'all', rare: false, fav: false, q: ''};
        updateBadge(); renderAdminBody(); toast(t('resetDone'));
      } else { state.resetArm = true; renderAdminBody(); setTimeout(() => { if(state.resetArm){ state.resetArm = false; if(state.route === 'admin' && state.adminTab === 'settings') renderAdminBody(); } }, 5000); }
      break;
  }
}

/* --- Auto-translation RU → UA ---
   The admin writes in Russian, the Ukrainian field fills itself and stays fully editable:
   a UA value the admin has typed is never overwritten (only the "Translate" button does that).
   Engines, best first: Claude (when the page runs inside claude.ai) → public MyMemory API
   (when the page is served from a normal website) → built-in word list (always works, approximate). */
const TRP = {};
const TR = {sample: undefined, p: null, off: false};
function trReset(){ Object.keys(TRP).forEach(k => delete TRP[k]); }
function trLabel(id, label){
  return '<div class="lab-row"><label for="' + id + '">' + label + '</label><button type="button" class="tr-btn" data-act="a-tr" data-for="' + id + '">' + ic('translate', 'ic-sm') + t('trBtn') + '</button></div>';
}
function trSample(){
  if(TR.sample !== undefined) return Promise.resolve(TR.sample);
  if(!TR.p){
    let p;
    try{ p = (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use('sample')) : Promise.resolve(null); }catch(e){ p = Promise.resolve(null); }
    TR.p = p.then(s => (TR.sample = typeof s === 'function' ? s : null), () => (TR.sample = null));
  }
  return TR.p;
}
async function trRemote(text, kind){
  const s = await trSample();
  if(s && !TR.off){
    try{
      const what = kind === 'name' ? 'a plant name (a product title in a garden centre)'
        : kind === 'title' ? 'the title of a blog article of a garden centre'
        : kind === 'summary' ? 'a short teaser of a blog article of a garden centre'
        : kind === 'text' ? 'a blog article of a garden centre (gardening tips, facts, links)'
        : 'a plant description from a garden centre catalogue';
      const out = await s('Translate ' + what + ' from Russian into Ukrainian. Keep Latin botanical names, cultivar names inside «» quotes and numbers unchanged, and keep the « » quotes. Keep line breaks, blank lines, list markers (- ), headings (## ), **bold** markers, [text](url) syntax and all URLs exactly as they are. Reply with the translation only: no extra quotes, no comments.\n\n' + text, {modelTier: kind === 'text' ? 'default' : 'quick'});
      const r = String(out && out.text || '').trim().replace(/^```[a-z]*\n?|\n?```$/g, '').trim();
      if(r) return {text: r, via: 'claude'};
    }catch(e){
      const c = e && e.code;
      if(c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed' || c === 'session_expired') TR.off = true;
    }
  }
  if(!window.claude){
    try{ const r = await trWeb(text); if(r) return {text: r, via: 'web'}; }catch(e){}
  }
  return null;
}
async function trWeb(text){
  const parts = text.match(/[^.!?\n]+[.!?]*[ \t]*|\n+/g) || [text];
  const chunks = []; let cur = '';
  parts.forEach(p => {
    if(p.charAt(0) === '\n'){ if(cur) chunks.push(cur); chunks.push(p); cur = ''; }       /* a line break always ends a chunk */
    else if(cur && (cur + p).length > 230){ chunks.push(cur); cur = p; } else cur += p;
  });
  if(cur) chunks.push(cur);
  if(chunks.length > 24) return null;
  const outs = [];
  for(const c of chunks){
    if(!/[А-Яа-яЁёЇїІіЄєҐґ]/.test(c)){ outs.push(c); continue; }
    const mk = /^\s*(?:#{2,3}\s+|[-•*]\s+|\d+[.)]\s+)/.exec(c);             /* list / heading marker stays as it is */
    const lead = mk ? mk[0] : c.match(/^\s*/)[0], trail = c.slice(lead.length).match(/\s*$/)[0];
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    let r; try{ r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(c.trim()) + '&langpair=' + encodeURIComponent('ru|uk'), {signal: ctl.signal}); } finally { clearTimeout(to); }
    if(!r.ok) return null;
    const j = await r.json();
    let tt = j && j.responseData && j.responseData.translatedText;
    if(!tt || Number(j.responseStatus) !== 200 || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID|PLEASE SELECT/i.test(tt)) return null;
    tt = new DOMParser().parseFromString(tt, 'text/html').documentElement.textContent;
    outs.push(lead + tt + trail);
  }
  const res = outs.join('');
  const sig = x => (x.match(/\]\(|\*\*|^\s*(?:#{2,3}|[-•*]|\d+[.)])\s/gm) || []).length;
  if(sig(res) !== sig(text)) return null;                  /* the translator damaged the markup: use the built-in converter */
  /* Latin names must survive untouched, otherwise prefer the built-in converter */
  if((text.match(/[A-Za-z][A-Za-z’'.\-]{2,}/g) || []).some(w => res.indexOf(w) < 0)) return null;
  return res;
}

      let r;
      if(lw === 'и') r = (UA_VOW.test(last) && !sentStart) ? 'й' : 'і';
      else if(lw === 'в') r = (sentStart ? !UA_VOW.test(nextCh) : !UA_VOW.test(last)) ? 'у' : 'в';
      else if(lw === 'с') r = 'з';
      else if(lw === 'со') r = 'зі';
      else if(lw === 'к') r = 'до';
      else if(TR_DICT[lw] !== undefined) r = TR_DICT[lw];
      else if(lw.indexOf('-') > 0) r = lw.split('-').map(p => TR_DICT[p] !== undefined ? TR_DICT[p] : uaGeneric(p)).join('-');
      else r = uaGeneric(lw);
      if((prevRu === 'с' || prevRu === 'со') && /ой$/.test(lw)) r = r.replace(/ий$/, 'ою');   /* «с голубой хвоей» → «з блакитною хвоєю» */
      prevRu = lw;
      piece = uaCase(piece, r);
    }
    out += piece;
    const m = out.match(/\S(?=\s*$)/); last = m ? m[0] : '';
  }
  return out.replace(/[ \t]{2,}/g, ' ').trim();
}

/* One RU→UA pair of fields. The UA field is "managed" while it is empty or still holds the last automatic result. */
function trPair(srcId, dstId, kind){
  const src = $('#' + srcId), dst = $('#' + dstId), hint = $('#' + dstId + '-h');
  if(!src || !dst) return;
  const P = {src: src, dst: dst, auto: null, timer: null, seq: 0, busy: null};
  const say = (key, cls) => { if(hint){ hint.textContent = key ? t(key) : ''; hint.className = 'tr-hint' + (cls ? ' ' + cls : ''); } };
  const managed = () => dst.value.trim() === '' || dst.value === P.auto;
  P.run = async function(force){
    clearTimeout(P.timer); P.timer = null;
    const text = src.value.trim(), mine = ++P.seq;
    if(!text){ if(managed()){ dst.value = ''; P.auto = ''; } say(''); return; }
    if(!force && !managed()){ say(''); return; }
    say('trBusy', 'busy');
    let r = null; try{ r = await trRemote(text, kind); }catch(e){}
    if(!r) r = {text: ruToUa(text), via: 'local'};
    if(mine !== P.seq || !document.contains(dst)) return;
    if(!force && !managed()){ say(''); return; }        /* the admin typed in the Ukrainian field meanwhile */
    dst.value = r.text; P.auto = r.text;
    dst.dispatchEvent(new Event('input', {bubbles: true}));
    if(!r.text.trim()) say('trFail', 'bad'); else say(r.via === 'local' ? 'trLocal' : 'trAuto', r.via === 'local' ? 'warn' : 'ok');
  };
  P.schedule = function(){ clearTimeout(P.timer); if(managed()) P.timer = setTimeout(() => { P.busy = P.run(false); }, 800); else say(''); };
  P.flush = function(){ if(P.timer) P.busy = P.run(false); return P.busy || Promise.resolve(); };
  TRP[srcId] = P; TRP[dstId] = P;
}
function trFlushAll(){ return Promise.all(Object.keys(TRP).map(k => TRP[k].flush())); }

/* ===== Events & boot ===== */
function clearErrs(f){ $$('.field.bad', f).forEach(x => { x.classList.remove('bad'); const r = x.querySelector('.err-t'); if(r) r.remove(); }); }
function busy(f, on){ const b = f.querySelector('button[type="submit"]'); if(b){ b.disabled = on; b.classList.toggle('is-busy', on); } }
/* sign in / register / create a password / change a password */
function authSubmit(f){
  clearErrs(f);
  const g = n => f.querySelector('[name="' + n + '"]'), val = n => g(n) ? g(n).value : '';
  let first = null;
  const bad = (n, k) => { setErr(g(n), t(k)); if(!first) first = g(n); };
  const id = f.id, email = id === 'loginForm' || id === 'regForm' || id === 'legacyForm' ? val('email') : (state.me && state.me.email);
  if(id === 'regForm' && val('name').trim().length < 2) bad('name', 'errName');
  if(id === 'legacyForm' && val('name').trim().length < 2) bad('name', 'errName');
  if((id === 'loginForm' || id === 'regForm') && !emailOk(val('email'))) bad('email', 'errEmail');
  if(id === 'loginForm'){ if(!val('password')) bad('password', 'errPwEmpty'); }
  else {
    if(id === 'pwForm' && g('current') && !val('current')) bad('current', 'errPwEmpty');
    const pk = pwProblem(val('password'), email); if(pk) bad('password', pk);
    else if(val('password') !== val('password2')) bad('password2', 'errPwMatch');
    else if(id === 'pwForm' && g('current') && val('current') === val('password')) bad('password', 'errPwSame');
  }
  if(first){ first.focus(); return; }
  busy(f, true);
  let job;
  if(id === 'loginForm') job = Auth.login(val('email'), val('password'));
  else if(id === 'regForm') job = Auth.register(val('name'), val('email'), val('password'));
  else if(id === 'legacyForm') job = Auth.legacySet(val('email'), val('name'), val('password'));
  else job = Auth.change(val('current'), val('password'));
  job.then(() => {
    state.authLegacy = null; state.usersList = null; state.authTab = 'login';
    renderChrome();
    if(id === 'pwForm'){ renderView(true); toast(t('pwSaved')); }
    else { renderView(true); toast(t('welcome', {n: state.me ? state.me.name : ''})); }
  }, e => {
    busy(f, false);
    if(e.code === 'no_password'){ state.authLegacy = normEmail(val('email')); renderView(true); return; }
    const target = id === 'loginForm' ? 'password' : id === 'pwForm' && e.code === 'bad_current' ? 'current' : id === 'regForm' && e.code === 'email_taken' ? 'email' : id === 'legacyForm' && e.code === 'legacy_name' ? 'name' : 'password';
    setErr(g(target) || g('password'), t(authErrKey(e)));
    (g(target) || g('password')).focus();
  });
}

function go(r){
  const cur = location.hash.replace(/^#/, '') || 'home';
  if(cur === r){ state.route = r; renderView(false); } else { location.hash = r; }
}
function resetFilters(){ state.filters = {cat: 'all', sort: 'def', light: 'all', rare: false, fav: false, q: ''}; }

document.addEventListener('click', function(e){
  const lg = e.target.closest('[data-lang]');
  if(lg){ setLang(lg.getAttribute('data-lang')); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  if(act.indexOf('a-') === 0){ adminClick(act, el); return; }
  switch(act){
    case 'close': closeModal(); break;
    case 'search': openSearch(); break;
    case 'search-all': resetFilters(); state.filters.q = el.getAttribute('data-q'); closeModal(true); go('catalog'); break;
    case 'contact': openContact(); break;
    case 'open': openProduct(id); break;
    case 'add': { cartSet(id, cartQty(id) + 1); toast(t('added'), {href: '#cart', label: t('toCart')}); break; }
    case 'inc': cartSet(id, cartQty(id) + 1); break;
    case 'dec': cartSet(id, cartQty(id) - 1); break;
    case 'rm': cartSet(id, 0); break;
    case 'fav': toggleFav(id); break;
    case 'copy': copyText(el.getAttribute('data-v')); break;
    case 'copy-order': if(state.lastOrder) copyText(orderText(state.lastOrder)); break;
    case 'gocat': resetFilters(); state.filters.cat = id; go('catalog'); break;
    case 'gorare': resetFilters(); state.filters.rare = true; go('catalog'); break;
    case 'fcat': state.filters.cat = id; renderGrid(); break;
    case 'flight': state.filters.light = el.getAttribute('data-v'); renderGrid(); break;
    case 'frare': state.filters.rare = !state.filters.rare; renderGrid(); break;
    case 'ffav': state.filters.fav = !state.filters.fav; renderGrid(); break;
    case 'fq-clear': state.filters.q = ''; renderGrid(); break;
    case 'freset': resetFilters(); renderGrid(); break;
    case 'rail': { const r = $('#rail'); if(r) r.scrollBy({left: r.clientWidth * 0.8 * Number(el.getAttribute('data-dir')), behavior: 'smooth'}); break; }
    case 'logout': Auth.logout().then(() => { state.usersList = null; state.authTab = 'login'; D.orders = SRV ? [] : D.orders; renderChrome(); renderView(true); toast(t('signedOut')); }); break;
    case 'reload': location.reload(); break;
    case 'art-new': state.adminTab = 'articles'; go('admin'); break;
    case 'art-edit': if(isAdmin()) openArticleEditor(id); break;
    case 'auth-tab': state.authTab = id === 'register' ? 'register' : 'login'; state.authLegacy = null; renderView(true); break;
    case 'pw-eye': {
      const inp = el.parentNode.querySelector('input'), show = inp.type === 'password';
      inp.type = show ? 'text' : 'password'; el.setAttribute('aria-pressed', show);
      el.setAttribute('aria-label', t(show ? 'pwHide' : 'pwShow')); el.innerHTML = ic(show ? 'eyeoff' : 'eye', 'ic-sm'); break;
    }
  }
});

document.addEventListener('input', function(e){
  const tg = e.target;
  const fb = tg.closest && tg.closest('.field.bad');                  /* typing in a field with an error clears the error */
  if(fb){ fb.classList.remove('bad'); const r = fb.querySelector('.err-t'); if(r) r.remove(); }
  if(tg.id === 'sq') searchResults(tg.value);
  else if(tg.id === 'aq'){ state.adminQ = tg.value; renderAdminList(); }
  const P = TRP[tg.id]; if(P && P.src === tg) P.schedule();            /* Russian field typed → Ukrainian follows */
  if(tg.form && tg.form.id === 'payForm') payPreview();
});

document.addEventListener('change', function(e){
  const tg = e.target;
  if(tg.id === 'sortSel'){ state.filters.sort = tg.value; renderGrid(); }
  else if(tg.name === 'delivery'){ state.co.delivery = tg.value; renderDelFields(); }
  else if(tg.name === 'pay'){ state.co.pay = tg.value; renderPayInfo(); }
  else if(tg.id === 's-card' || tg.id === 's-acc'){ tg.value = fmtPay(tg.value); payPreview(); }
  else if(TRP[tg.id] && TRP[tg.id].src === tg){ TRP[tg.id].flush(); }
  else if(tg.hasAttribute && tg.hasAttribute('data-oid')){
    const oid = tg.getAttribute('data-oid'), o = D.orders.find(x => x.id === oid), prev = o && o.status;
    if(o && isAdmin()) Auth.setStatus(oid, tg.value).then(() => {
      toast(t('saved')); const b = $('.tab[data-id="orders"]'); if(b){ const n = D.orders.filter(x => x.status === 'new').length; b.innerHTML = t('tabOrders') + (n ? ' <span class="b">' + n + '</span>' : ''); }
    }, () => { if(o) o.status = prev; tg.value = prev; toast(t('srvFail'), {err: true}); });
  }
  else if(tg.id === 'f-photo' && tg.files && tg.files[0]){
    readImage(tg.files[0]).then(d => { edImg = d; edPreview(); }, () => toast(t('photoFail'), {err: true}));
  }
  else if(tg.id === 'a-photo' && tg.files && tg.files[0]){
    readImage(tg.files[0], 1400).then(d => { edArtImg = d; artPreview(); }, () => toast(t('photoFail'), {err: true}));
  }
  else if(tg.id === 'f-cat' && !edImg){ edPreview(); }
});

document.addEventListener('submit', function(e){
  const f = e.target;
  e.preventDefault();
  if(f.id === 'loginForm' || f.id === 'regForm' || f.id === 'legacyForm' || f.id === 'pwForm'){ authSubmit(f); }
  else if(f.id === 'coForm'){ submitOrder(f); }
  else if(f.id === 'prodForm'){ trFlushAll().then(() => saveProduct(f)); }
  else if(f.id === 'artForm'){ const mode = e.submitter && e.submitter.value === 'draft' ? 'draft' : 'publish'; trFlushAll().then(() => saveArticle(f, mode)); }
  else if(f.id === 'payForm'){ trFlushAll().then(() => savePay(f)); }
  else if(f.id === 'setForm'){ saveSettings(f); }
  else if(f.id === 'catAddForm'){
    const ua = f.querySelector('[name="ua"]').value.trim(), ru = f.querySelector('[name="ru"]').value.trim() || ua;
    if(!ua){ f.querySelector('[name="ua"]').focus(); return; }
    D.cats.push({id: 'c' + Date.now().toString(36), ua: ua, ru: ru}); persist('cats'); renderAdminBody(); toast(t('saved'));
  }
  else if(f.classList.contains('catrow')){
    const c = cat(f.getAttribute('data-cid')); if(!c) return;
    const ua = f.querySelector('[name="ua"]').value.trim(), ru = f.querySelector('[name="ru"]').value.trim() || ua;
    if(!ua) return;
    c.ua = ua; c.ru = ru; persist('cats'); toast(t('saved'));
  }
  else if(f.id === 'adminAddForm'){
    if(!isOwner()) return;
    const m = f.querySelector('[name="email"]'), em = normEmail(m.value);
    clearErrs(f);
    if(!emailOk(em)){ setErr(m, t('errEmail')); m.focus(); return; }
    if(D.admins.some(x => x.email === em) && (state.usersList || []).some(u => u.email === em)){ setErr(m, t('errDup')); m.focus(); return; }
    busy(f, true);
    Auth.addAdmin(em).then(r => {
      busy(f, false); loadUsersList(); renderAdminBody();
      if(r.temp) showTempPw(em, r.temp); else toast(t('adminHasAcc'), {ms: 4500});
    }, e => { busy(f, false); setErr(m, t(authErrKey(e))); m.focus(); });
  }
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && modalEl){ closeModal(); return; }
  if(e.key === 'Enter' && e.target.id === 'sq'){
    const q = e.target.value.trim();
    if(q){ e.preventDefault(); resetFilters(); state.filters.q = q; closeModal(true); go('catalog'); }
    return;
  }
  if(e.key === 'Tab' && modalEl){
    const f = $$('button,a[href],input,select,textarea,summary,[tabindex]:not([tabindex="-1"])', modalEl).filter(x => !x.disabled && x.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

async function init(){
  loadPrefs();
  D.products = []; D.cats = []; D.admins = []; D.users = []; D.orders = []; D.articles = []; D.settings = Object.assign({}, SETTINGS_SEED);
  const sc = $('#scene'); if(sc) sc.innerHTML = '<img src="' + HERO + '" alt="" decoding="async">';
  document.documentElement.lang = state.lang === 'ua' ? 'uk' : 'ru';
  $('#view').innerHTML = '<div class="wrap boot"><span class="spin" aria-hidden="true"></span><p class="note">' + t('loading') + '</p></div>';
  renderChrome();
  if(await detectServer()){
    try{ await loadServer(); }
    catch(e){ $('#view').innerHTML = '<div class="wrap boot"><p class="note">' + t('serverDown') + '</p><button class="btn btn-outline btn-sm" data-act="reload">OK</button></div>'; return; }
  } else loadData();
  renderChrome();
  route();
  window.addEventListener('hashchange', route);
}
init();


})();
